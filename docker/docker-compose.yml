name: phpnewsletter_8_1

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:80"
    environment:
      COMPOSER_INSTALL: ${COMPOSER_INSTALL:-true}
    volumes:
      - ..:/var/www/html
      - composer-cache:/tmp/composer
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/login') === false ? 1 : 0);"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    init: true
    restart: unless-stopped
    user: www-data
    entrypoint: ["php", "artisan", "schedule:work"]
    volumes:
      - ..:/var/www/html
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-phpnewsletter}
      MYSQL_USER: ${DB_USERNAME:-phpnewsletter}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-test:
    profiles: [test]
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: phpnewsletter_test
      MYSQL_USER: phpnewsletter_test
      MYSQL_PASSWORD: phpnewsletter_test
      MYSQL_ROOT_PASSWORD: test-root
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 2s
      timeout: 5s
      retries: 30

  tests:
    profiles: [test]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    init: true
    user: www-data
    environment:
      COMPOSER_INSTALL: "false"
    command: ["php", "artisan", "test"]
    volumes:
      - ..:/var/www/html
    tmpfs:
      - /var/www/html/storage:mode=1777
    depends_on:
      mysql-test:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.29.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-5000}
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    volumes:
      - mailpit_data:/data

volumes:
  composer-cache:
  mysql_data:
  mailpit_data:
